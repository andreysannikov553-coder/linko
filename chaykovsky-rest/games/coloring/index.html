<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Раскраска</title>
<style>
:root{--bg:#F4EFE7;--paper:#FCFAF6;--ink:#1E1B17;--soft:#5A5148;--line:#E3DBCE;--accent:#22201C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:460px;margin:0 auto;padding:18px 14px 32px}
.top{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font:700 34px/1 Georgia,serif}
.top a{color:var(--soft);font-size:14px}
.pics{display:flex;gap:6px;margin:14px 0 10px;flex-wrap:wrap}
button{font:inherit;font-weight:700;border-radius:12px;border:1px solid var(--accent);padding:9px 14px;background:var(--accent);color:var(--bg);cursor:pointer}
button.alt{background:var(--paper);color:var(--ink);border-color:var(--line)}
button.alt[aria-pressed="true"]{border-color:var(--accent);background:#E9E2D6}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{position:relative;width:100%;aspect-ratio:1;background:#fff;border:2px solid var(--line);border-radius:18px;overflow:hidden;touch-action:manipulation;cursor:pointer}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#lines{pointer-events:none}
.pal{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.sw{width:42px;height:42px;border-radius:50%;padding:0;border:3px solid var(--paper);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.acts{display:flex;gap:8px}
p.hint{color:var(--soft);font-size:14px;margin:14px 0 0}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Раскраска</h1><a href="../../">&larr; Назад</a></div>
  <div class="pics" id="pics" role="group" aria-label="Выбор рисунка"></div>
  <div class="stage" id="stage" role="img" aria-label="Рисунок для раскрашивания: коснитесь области, чтобы закрасить">
    <canvas id="fill" width="600" height="600"></canvas>
    <canvas id="lines" width="600" height="600"></canvas>
  </div>
  <div class="pal" id="pal" role="group" aria-label="Цвета"></div>
  <div class="acts"><button class="alt" id="undo" type="button" disabled>Отменить</button><button class="alt" id="clear" type="button">Очистить</button></div>
  <p class="hint">Выберите цвет и коснитесь части рисунка.</p>
</main>
<script>
(function(){
  var S=600,K=S/100;
  var PICS=[
    {n:"Рыбка",p:["M12 50C28 24 62 24 78 50C62 76 28 76 12 50Z","M78 50L95 31L95 69Z","M42 33C42 20 56 20 58 34Z","M30 56C34 66 44 70 50 68C44 64 36 62 30 56Z","M27 44a3 3 0 1 0-6 0a3 3 0 1 0 6 0Z"],o:["M14 53Q18 56 22 53","M50 44q4 4 0 8","M60 42q4 4 0 8"]},
    {n:"Кекс",p:["M24 56H76L68 90H32Z","M36 56L38 90L50 90L50 56Z","M50 56L50 90L62 90L64 56Z","M20 56C14 44 26 36 32 36C32 24 50 18 56 28C66 24 80 34 74 44C84 46 82 56 76 56Z","M57 17a5 5 0 1 0-10 0a5 5 0 1 0 10 0Z"],o:["M52 12Q54 6 58 5","M30 46Q40 52 50 46","M52 40Q62 46 72 40"]},
    {n:"Мороженое",p:["M30 52L70 52L50 94Z","M26 52C20 36 36 26 50 30C64 26 80 36 74 52Z","M34 34C30 18 44 8 54 14C66 10 76 22 66 34Z","M64 12a4 4 0 1 0-8 0a4 4 0 1 0 8 0Z"],o:["M40 52L58 84","M60 52L42 84","M34 66H66"]},
    {n:"Яблоко",p:["M50 30C30 14 8 34 14 60C20 84 40 92 50 86C60 92 80 84 86 60C92 34 70 14 50 30Z","M52 28C52 14 62 8 74 10C74 22 64 30 52 28Z","M26 46C22 54 24 62 30 66C28 58 28 52 34 46Z"],o:["M50 30C50 22 48 16 46 10"]}
  ];
  var COLORS=["#E5484D","#F08A24","#F2C14E","#6FBF73","#4DA3E0","#7B61C9","#F4A6C1","#8B5A2B","#2B2B2B","#FFFFFF"];
  var NAMES=["красный","оранжевый","жёлтый","зелёный","голубой","фиолетовый","розовый","коричневый","чёрный","белый (ластик)"];
  var fill=document.getElementById("fill"),lines=document.getElementById("lines"),stage=document.getElementById("stage");
  var fc=fill.getContext("2d",{willReadFrequently:true}),lc=lines.getContext("2d",{willReadFrequently:true});
  var cur=COLORS[0],mask=null,hist=[],pic=0;
  function drawLines(){
    lc.clearRect(0,0,S,S);lc.save();lc.scale(K,K);lc.lineWidth=1.9;lc.lineJoin="round";lc.lineCap="round";lc.strokeStyle="#1E1B17";
    var p=PICS[pic];p.p.concat(p.o).forEach(function(d){lc.stroke(new Path2D(d))});
    lc.restore();
    var a=lc.getImageData(0,0,S,S).data;mask=new Uint8Array(S*S);
    for(var i=0;i<S*S;i++)mask[i]=a[i*4+3]>40?1:0;
  }
  function reset(){fc.fillStyle="#fff";fc.fillRect(0,0,S,S);hist=[];upd()}
  function upd(){document.getElementById("undo").disabled=!hist.length}
  function hex(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
  function paint(x,y){
    if(x<0||y<0||x>=S||y>=S||mask[y*S+x])return;
    var img=fc.getImageData(0,0,S,S),d=img.data,rgb=hex(cur);
    if(hist.length>=15)hist.shift();
    hist.push(fc.getImageData(0,0,S,S));
    var seen=new Uint8Array(S*S),stack=[y*S+x];seen[y*S+x]=1;
    function put(i){d[i*4]=rgb[0];d[i*4+1]=rgb[1];d[i*4+2]=rgb[2];d[i*4+3]=255}
    while(stack.length){
      var i=stack.pop();put(i);
      var cx=i%S,cy=(i-cx)/S,nb=[cx>0?i-1:-1,cx<S-1?i+1:-1,cy>0?i-S:-1,cy<S-1?i+S:-1];
      for(var k=0;k<4;k++){
        var j=nb[k];if(j<0||seen[j])continue;seen[j]=1;
        if(mask[j])put(j);else stack.push(j);
      }
    }
    fc.putImageData(img,0,0);upd();
  }
  stage.addEventListener("click",function(e){
    var r=stage.getBoundingClientRect();
    paint(Math.floor((e.clientX-r.left)/r.width*S),Math.floor((e.clientY-r.top)/r.height*S));
  });
  var picsEl=document.getElementById("pics");
  PICS.forEach(function(p,i){
    var b=document.createElement("button");b.type="button";b.className="alt";b.textContent=p.n;b.setAttribute("aria-pressed",i===0);
    b.addEventListener("click",function(){pic=i;picsEl.querySelectorAll("button").forEach(function(x,k){x.setAttribute("aria-pressed",k===i)});drawLines();reset()});
    picsEl.appendChild(b);
  });
  var palEl=document.getElementById("pal");
  COLORS.forEach(function(c,i){
    var b=document.createElement("button");b.type="button";b.className="sw";b.style.background=c;b.setAttribute("aria-label",NAMES[i]);b.setAttribute("aria-pressed",i===0);
    b.addEventListener("click",function(){cur=c;palEl.querySelectorAll("button").forEach(function(x,k){x.setAttribute("aria-pressed",k===i)})});
    palEl.appendChild(b);
  });
  document.getElementById("undo").addEventListener("click",function(){var h=hist.pop();if(h)fc.putImageData(h,0,0);upd()});
  document.getElementById("clear").addEventListener("click",reset);
  drawLines();reset();
})();
</script>
</body>
</html>
