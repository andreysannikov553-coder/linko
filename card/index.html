<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<title>Спасибо, что заглянули</title>
<meta name="description" content="Оставьте отзыв на Яндекс Картах или в 2ГИС.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap&subset=cyrillic">
<style>
:root{--bg:#FFFFFF;--tint:#F4F2EE;--ink:#16130F;--soft:#5C554D;--faint:#746C62;--line:#E6E1DA;
  --ember:#C23D17;--ember-d:#A0320F;--ember-l:#FBE9E2;
  --disp:"Unbounded","Arial Black",system-ui,sans-serif;--text:"Onest",-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--text);min-height:100svh;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
a{color:inherit}
.w{width:min(440px,100%);margin:0 auto;padding:0 16px}

/* шапка: телефон касается шестигранной карточки (универсально, без названия заведения) */
.top{position:relative;overflow:hidden;padding:30px 0 26px;text-align:center;
  background:radial-gradient(120% 90% at 50% 0%,var(--ember-l) 0%,rgba(251,233,226,0) 70%)}
.combs{position:absolute;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none}
.tap{position:relative;width:200px;height:170px;margin:0 auto}
.tap .card{position:absolute;left:50%;bottom:6px;width:120px;height:104px;transform:translateX(-50%) perspective(400px) rotateX(52deg);transform-origin:50% 100%}
.tap .card svg{width:100%;height:100%;filter:drop-shadow(0 10px 14px rgba(194,61,23,.25))}
.tap .ph{position:absolute;left:50%;top:0;width:54px;height:96px;margin-left:-27px;border-radius:14px;background:#16130F;padding:5px;
  box-shadow:0 16px 30px rgba(22,19,15,.25);animation:tapph 2.8s cubic-bezier(.5,0,.3,1) infinite}
.tap .ph i{display:block;width:100%;height:100%;border-radius:10px;background:linear-gradient(160deg,#fff 0%,#FBE9E2 100%);position:relative;overflow:hidden}
.tap .ph i::before{content:"";position:absolute;left:50%;top:5px;width:16px;height:4px;margin-left:-8px;border-radius:3px;background:#16130F}
.tap .ph b{position:absolute;left:0;right:0;top:34px;color:#F5A623;font-size:9px;letter-spacing:1px;opacity:0;animation:okstar 2.8s ease infinite}
.tap .ring{position:absolute;left:50%;bottom:30px;width:90px;height:36px;margin-left:-45px;border-radius:50%;border:2px solid var(--ember);opacity:0;animation:ring 2.8s ease-out infinite}
.tap .ring.b{animation-delay:.25s}
@keyframes tapph{0%,12%{transform:translateY(-6px) rotate(-8deg)}40%,62%{transform:translateY(42px) rotate(0)}88%,100%{transform:translateY(-6px) rotate(-8deg)}}
@keyframes ring{0%,38%{transform:scale(.5);opacity:0}42%{opacity:.7}75%,100%{transform:scale(1.5);opacity:0}}
@keyframes okstar{0%,42%{opacity:0;transform:scale(.6)}50%,80%{opacity:1;transform:none}92%,100%{opacity:0}}
.hello{position:relative;margin-top:14px;font:500 13px/1.3 var(--text);color:var(--faint);letter-spacing:.02em}
h1{position:relative;margin-top:8px;font:700 clamp(25px,7vw,30px)/1.15 var(--disp);letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--ember)}

/* отзывы */
.rate{margin-top:6px;background:var(--tint);border-radius:24px;padding:22px 18px 20px;text-align:center}
.rate h2{font:600 17px/1.3 var(--disp)}
.rate p{margin-top:6px;color:var(--soft);font-size:14.5px}
.stars{display:flex;justify-content:center;gap:6px;margin:14px 0 16px}
.stars button{width:40px;height:40px;border:0;background:none;padding:0;cursor:pointer;color:#D8D1C7;transition:transform .15s,color .15s}
.stars button svg{width:100%;height:100%}
.stars button.on{color:#F5A623}
.stars button:active{transform:scale(.88)}
.maps{display:grid;gap:10px}
.map{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:#fff;border:1px solid var(--line);
  text-decoration:none;text-align:left;transition:transform .15s,box-shadow .15s}
.map:active{transform:scale(.98)}
.map:hover{box-shadow:0 8px 24px rgba(22,19,15,.08)}
.map .ic{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center}
.map .ic svg{width:26px;height:26px}
.map.y .ic{background:#FFF0EC}.map.g .ic{background:#EAF7EA}
.map b{display:block;font:600 16px/1.25 var(--text)}
.map span{display:block;color:var(--faint);font-size:13px;margin-top:2px}
.map .go{margin-left:auto;flex:none;width:30px;height:30px;border-radius:50%;background:var(--ember);color:#fff;display:grid;place-items:center}
.map .go svg{width:14px;height:14px}

.foot{margin:34px 0 26px;text-align:center;color:var(--faint);font-size:11.5px;line-height:1.6}
.foot .by{display:inline-flex;align-items:center;gap:6px;color:var(--soft)}
.foot .by svg{width:20px;height:13px;fill:none;stroke:var(--ember);stroke-width:2.6}
.foot .by b{font:700 11px/1 var(--disp);letter-spacing:.08em;color:var(--ink)}
.thanks{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,calc(100% + 120px));background:var(--ink);color:#fff;
  padding:12px 18px;border-radius:14px;font-size:14px;transition:transform .35s cubic-bezier(.2,.9,.3,1.1),opacity .2s,visibility 0s .35s;max-width:calc(100% - 32px);
  opacity:0;visibility:hidden;pointer-events:none}
.thanks.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .35s cubic-bezier(.2,.9,.3,1.1),opacity .2s,visibility 0s}
@media (prefers-reduced-motion:reduce){.tap .ph,.tap .ring,.tap .ph b{animation:none}.tap .ph{transform:translateY(20px)}.tap .ph b{opacity:1}}
</style>
</head>
<body>
<script>
/* Ссылки на отзывы заведения. У каждой карточки свои: в адресе страницы ?y=<Яндекс Карты>&g=<2ГИС>
   (или прописать здесь для отдельной копии страницы). */
var CFG = { yandex: "", twogis: "" };
</script>

<header class="top">
  <svg class="combs" viewBox="0 0 440 300" preserveAspectRatio="xMidYMin slice" aria-hidden="true" fill="none" stroke="#C23D17" stroke-opacity=".14" stroke-width="1.2" id="combs"></svg>
  <div class="w">
    <div class="tap" aria-hidden="true">
      <div class="card"><svg viewBox="0 0 120 104"><path d="M60 2 L117 32 L117 72 L60 102 L3 72 L3 32 Z" fill="#fff" stroke="#C23D17" stroke-width="3" stroke-linejoin="round"/>
        <path d="M60 14 L106 38 L106 66 L60 90 L14 66 L14 38 Z" fill="#FBE9E2"/></svg></div>
      <span class="ring"></span><span class="ring b"></span>
      <div class="ph"><i></i><b>★★★★★</b></div>
    </div>
    <p class="hello">Вы приложили телефон к карточке</p>
    <h1>Спасибо, что <em>заглянули</em></h1>
  </div>
</header>

<main class="w">
  <section class="rate" aria-labelledby="rate-h">
    <h2 id="rate-h">Как вам у нас?</h2>
    <p>Отзыв занимает минуту и очень нам помогает</p>
    <div class="stars" role="radiogroup" aria-label="Оценка">
      <button type="button" role="radio" aria-checked="false" aria-label="1 звезда"></button>
      <button type="button" role="radio" aria-checked="false" aria-label="2 звезды"></button>
      <button type="button" role="radio" aria-checked="false" aria-label="3 звезды"></button>
      <button type="button" role="radio" aria-checked="false" aria-label="4 звезды"></button>
      <button type="button" role="radio" aria-checked="false" aria-label="5 звёзд"></button>
    </div>
    <div class="maps">
      <a class="map y" id="go-y" rel="noopener">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7z" fill="#FC3F1D"/><circle cx="12" cy="9" r="2.8" fill="#fff"/></svg></span>
        <span><b>Яндекс Карты</b><span>Оставить отзыв</span></span>
        <span class="go"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 3l5 5-5 5"/></svg></span>
      </a>
      <a class="map g" id="go-g" rel="noopener">
        <span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="6" fill="#19AA1E"/><path d="M8 15.5c0-2.6 6.5-2.4 6.5-5.4 0-1.3-1.1-2.1-2.4-2.1-1.4 0-2.4.9-2.6 2.1M8 15.5h7" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/></svg></span>
        <span><b>2ГИС</b><span>Оставить отзыв</span></span>
        <span class="go"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 3l5 5-5 5"/></svg></span>
      </a>
    </div>
  </section>

  <footer class="foot">
    <span class="by">Карточка и страница сделаны <svg viewBox="0 0 32 20" aria-hidden="true"><rect x="1.5" y="3" width="17" height="14" rx="7"/><rect x="13.5" y="3" width="17" height="14" rx="7"/></svg><b>LINKO</b></span><br>
    NFC + QR · отзывы на Яндекс Картах и в 2ГИС
  </footer>
</main>
<div class="thanks" id="thanks" role="status" aria-live="polite"></div>

<script>
(function(){
  var STAR = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z"/></svg>';
  var stars = [].slice.call(document.querySelectorAll(".stars button")), toast = document.getElementById("thanks");
  function link(id, url){ var a = document.getElementById(id); a.href = url || "#"; if (url) a.target = "_blank";
    else a.addEventListener("click", function(e){ e.preventDefault(); say("Ссылка на отзывы подключается при установке карточки"); }); }
  var q = new URLSearchParams(location.search);
  link("go-y", q.get("y") || CFG.yandex); link("go-g", q.get("g") || CFG.twogis);
  function say(t){ toast.textContent = t; toast.classList.add("show"); clearTimeout(say.t); say.t = setTimeout(function(){ toast.classList.remove("show"); }, 2600); }
  stars.forEach(function(b, i){
    b.innerHTML = STAR;
    b.addEventListener("click", function(){
      stars.forEach(function(s, j){ s.classList.toggle("on", j <= i); s.setAttribute("aria-checked", j === i ? "true" : "false"); });
      say(i >= 3 ? "Спасибо! Поделитесь оценкой на картах ниже" : "Спасибо! Расскажите, что улучшить, в отзыве на картах");
    });
  });
  /* соты на фоне шапки */
  var g = document.getElementById("combs"), r = 26, h = r * Math.sqrt(3), out = "";
  for (var row = 0; row < 7; row++) for (var col = 0; col < 12; col++){
    var cx = col * r * 1.5, cy = row * h + (col % 2 ? h / 2 : 0), p = [];
    for (var k = 0; k < 6; k++){ var a = Math.PI / 3 * k; p.push((cx + r * Math.cos(a)).toFixed(1) + "," + (cy + r * Math.sin(a)).toFixed(1)); }
    out += '<polygon points="' + p.join(" ") + '"/>';
  }
  g.innerHTML = out;
})();
</script>
</body>
</html>
