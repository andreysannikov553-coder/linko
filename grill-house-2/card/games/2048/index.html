<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex">
<title>2048</title>
<style>
:root{--bg:#F4EFE7;--paper:#FCFAF6;--ink:#1E1B17;--soft:#5A5148;--line:#E3DBCE;--cell:#E9E2D6;--accent:#22201C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:420px;margin:0 auto;padding:20px 16px 32px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{margin:0;font:700 44px/1 Georgia,serif}
.sc{display:flex;gap:8px}
.sc div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 12px;text-align:center;min-width:64px}
.sc small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.sc b{font-size:18px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:14px 0}
.bar a{color:var(--soft);font-size:14px}
button{font:inherit;font-weight:700;padding:10px 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#board{position:relative;background:var(--line);border-radius:14px;padding:8px;aspect-ratio:1;display:grid;grid-template:repeat(4,1fr)/repeat(4,1fr);gap:8px;touch-action:none}
.c{display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--cell);font-weight:700;font-size:clamp(20px,7vw,30px);color:var(--ink)}
.v2{background:#EFE6D6}.v4{background:#E6D5B8}.v8{background:#D9A26B;color:#fff}.v16{background:#CF8350;color:#fff}
.v32{background:#C7653F;color:#fff}.v64{background:#B94A2A;color:#fff}.v128{background:#C9A35C;color:#fff;font-size:clamp(18px,6vw,26px)}
.v256{background:#BE9440;color:#fff;font-size:clamp(18px,6vw,26px)}.v512{background:#A8812F;color:#fff;font-size:clamp(18px,6vw,26px)}
.v1024,.v2048,.vbig{background:#22201C;color:#F4EFE7;font-size:clamp(15px,5vw,22px)}
#over{position:absolute;inset:0;border-radius:14px;background:rgba(244,239,231,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:700;font-size:24px;text-align:center}
#over.on{display:flex}
p{color:var(--soft);font-size:14px;margin:14px 0 0}
</style>
</head>
<body>
<main>
  <div class="top"><h1>2048</h1><div class="sc"><div><small>Счёт</small><b id="s">0</b></div><div><small>Рекорд</small><b id="b">0</b></div></div></div>
  <div class="bar"><a href="../../">&larr; Назад</a><button id="new" type="button">Новая игра</button></div>
  <div id="board" role="application" aria-label="Игровое поле 2048"><div id="over"><span id="ot">Игра окончена</span><button id="again" type="button">Ещё раз</button></div></div>
  <p>Проведите пальцем или нажмите стрелки. Одинаковые плитки складываются.</p>
</main>
<script>
(function(){
  var N=4,g,score,best=0,over=false,won=false;
  try{best=+localStorage.getItem("g2048")||0}catch(e){}
  var bd=document.getElementById("board"),ov=document.getElementById("over"),ot=document.getElementById("ot");
  function empty(){var r=[];for(var y=0;y<N;y++){r.push([0,0,0,0])}return r}
  function add(){var f=[];for(var y=0;y<N;y++)for(var x=0;x<N;x++)if(!g[y][x])f.push([y,x]);
    if(!f.length)return;var p=f[Math.floor(Math.random()*f.length)];g[p[0]][p[1]]=Math.random()<.9?2:4}
  function start(){g=empty();score=0;over=false;won=false;add();add();ov.classList.remove("on");draw()}
  function draw(){
    bd.querySelectorAll(".c").forEach(function(e){e.remove()});
    for(var y=0;y<N;y++)for(var x=0;x<N;x++){var v=g[y][x],d=document.createElement("div");
      d.className="c"+(v?" v"+(v>2048?"big":v):"");d.textContent=v||"";bd.insertBefore(d,ov)}
    if(score>best){best=score;try{localStorage.setItem("g2048",best)}catch(e){}}
    document.getElementById("s").textContent=score;document.getElementById("b").textContent=best;
  }
  function line(a){
    var t=a.filter(Boolean),o=[];
    for(var i=0;i<t.length;i++){if(t[i]===t[i+1]){o.push(t[i]*2);score+=t[i]*2;i++}else o.push(t[i])}
    while(o.length<N)o.push(0);return o;
  }
  function move(dir){
    if(over)return;
    var before=JSON.stringify(g),y,a;
    for(var i=0;i<N;i++){
      if(dir==="l"||dir==="r"){a=g[i].slice();if(dir==="r")a.reverse();a=line(a);if(dir==="r")a.reverse();g[i]=a}
      else{a=[];for(y=0;y<N;y++)a.push(g[y][i]);if(dir==="d")a.reverse();a=line(a);if(dir==="d")a.reverse();for(y=0;y<N;y++)g[y][i]=a[y]}
    }
    if(JSON.stringify(g)===before)return;
    add();draw();
    var has2048=g.some(function(r){return r.indexOf(2048)>-1});
    if(has2048&&!won){won=true;ot.textContent="2048! Можно играть дальше";ov.classList.add("on");setTimeout(function(){if(!over)ov.classList.remove("on")},1800)}
    if(!can()){over=true;ot.textContent="Игра окончена";ov.classList.add("on")}
  }
  function can(){
    for(var y=0;y<N;y++)for(var x=0;x<N;x++){
      if(!g[y][x])return true;
      if(x<N-1&&g[y][x]===g[y][x+1])return true;
      if(y<N-1&&g[y][x]===g[y+1][x])return true;
    }return false;
  }
  var K={ArrowLeft:"l",ArrowRight:"r",ArrowUp:"u",ArrowDown:"d"};
  document.addEventListener("keydown",function(e){if(K[e.key]){e.preventDefault();move(K[e.key])}});
  var sx,sy;
  bd.addEventListener("touchstart",function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});
  bd.addEventListener("touchend",function(e){
    var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
    move(Math.abs(dx)>Math.abs(dy)?(dx>0?"r":"l"):(dy>0?"d":"u"));
  },{passive:true});
  document.getElementById("new").addEventListener("click",start);
  document.getElementById("again").addEventListener("click",start);
  start();
})();
</script>
</body>
</html>
