<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Найди пару</title>
<style>
:root{--bg:#F4EFE7;--paper:#FCFAF6;--ink:#1E1B17;--soft:#5A5148;--line:#E3DBCE;--accent:#22201C;--back:#CDB27A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:430px;margin:0 auto;padding:18px 14px 32px}
.top{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font:700 34px/1 Georgia,serif}
.top a{color:var(--soft);font-size:14px}
.ctl{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:14px 0}
.lvl{display:flex;gap:6px}
button{font:inherit;font-weight:700;border-radius:12px;border:1px solid var(--accent);padding:10px 16px;background:var(--accent);color:var(--bg);cursor:pointer}
button.alt{background:var(--paper);color:var(--ink);border-color:var(--line)}
button.alt[aria-pressed="true"]{border-color:var(--accent);background:#E9E2D6}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stat{color:var(--soft);font-size:15px;text-align:right}
#board{display:grid;gap:10px;position:relative}
.card{aspect-ratio:1;perspective:600px;padding:0;border:0;background:none;border-radius:16px}
.in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.card.open .in,.card.done .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.b{background:var(--back);border:2px solid #B89C5D}
.b::after{content:"";width:34%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(255,255,255,.55)}
.f{background:#fff;border:2px solid var(--line);transform:rotateY(180deg)}
.f svg{width:72%;height:72%}
.card.done .f{background:#F2F8EE;border-color:#9CC58A}
#win{position:absolute;inset:0;border-radius:16px;background:rgba(244,239,231,.93);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;font-weight:700;font-size:26px;z-index:2}
#win.on{display:flex}
#win small{font-size:16px;font-weight:500;color:var(--soft)}
p.hint{color:var(--soft);font-size:14px;margin:14px 0 0}
@media (prefers-reduced-motion:reduce){.in{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Найди пару</h1><a href="../../">&larr; Назад</a></div>
  <div class="ctl">
    <div class="lvl"><button class="alt" id="easy" type="button" aria-pressed="true">Легко</button><button class="alt" id="hard" type="button" aria-pressed="false">Сложнее</button></div>
    <div class="stat">Ходов: <b id="mv">0</b></div>
  </div>
  <div id="board" role="group" aria-label="Игровое поле">
    <div id="win" role="status"><span>Молодец!</span><small id="wt"></small><button id="again" type="button">Играть ещё</button></div>
  </div>
  <p class="hint">Открывайте по две карточки и ищите одинаковые картинки.</p>
</main>
<script>
(function(){
  var ICONS={
    apple:'<circle cx="32" cy="38" r="18" fill="#E5484D"/><path d="M32 20c0-6 4-10 9-11-1 6-4 10-9 11z" fill="#4CAF50"/><rect x="31" y="14" width="3" height="9" rx="1.5" fill="#6B4226"/>',
    pizza:'<path d="M10 14 L54 14 L32 56 Z" fill="#F2C14E"/><path d="M10 14h44" stroke="#D98E2B" stroke-width="6" stroke-linecap="round"/><circle cx="26" cy="26" r="4" fill="#D64545"/><circle cx="38" cy="26" r="4" fill="#D64545"/><circle cx="32" cy="40" r="4" fill="#D64545"/>',
    icecream:'<path d="M20 30 L44 30 L32 58 Z" fill="#E0A458"/><circle cx="24" cy="26" r="8" fill="#F4A6C1"/><circle cx="40" cy="26" r="8" fill="#F8C8DC"/><circle cx="32" cy="22" r="12" fill="#F4A6C1"/><circle cx="32" cy="11" r="3" fill="#E5484D"/>',
    fish:'<ellipse cx="28" cy="32" rx="20" ry="13" fill="#4DA3E0"/><path d="M46 32 L60 20 L60 44 Z" fill="#2F7FBF"/><circle cx="18" cy="29" r="3" fill="#fff"/><circle cx="17" cy="29" r="1.5" fill="#222"/>',
    carrot:'<path d="M22 22 H42 L32 58 Z" fill="#F08A24"/><path d="M32 22 C28 10 22 9 19 11 C23 13 28 16 32 22Z M32 22 C34 9 40 7 45 9 C40 12 36 16 32 22Z" fill="#4CAF50"/>',
    cupcake:'<path d="M14 34 H50 L44 56 H20 Z" fill="#C98B5A"/><path d="M14 34 C12 22 22 18 26 16 C28 8 38 8 38 16 C44 18 52 22 50 34 Z" fill="#F7A8C4"/><circle cx="32" cy="10" r="3.5" fill="#E5484D"/>',
    burger:'<path d="M10 28 C10 14 54 14 54 28 Z" fill="#E0A458"/><rect x="8" y="30" width="48" height="6" rx="3" fill="#4CAF50"/><rect x="10" y="37" width="44" height="7" rx="3" fill="#8B4A2B"/><path d="M10 46 H54 V48 C54 52 50 54 46 54 H18 C14 54 10 52 10 48Z" fill="#E0A458"/>',
    star:'<path d="M32 6 L39 24 L58 25 L43 37 L48 56 L32 46 L16 56 L21 37 L6 25 L25 24 Z" fill="#F2C14E"/>'
  };
  var NAMES=Object.keys(ICONS),pairs=6,first=null,lock=false,moves=0,found=0;
  var board=document.getElementById("board"),win=document.getElementById("win"),mv=document.getElementById("mv");
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
  function start(){
    var set=shuffle(NAMES.slice()).slice(0,pairs),deck=shuffle(set.concat(set));
    board.querySelectorAll(".card").forEach(function(c){c.remove()});
    board.style.gridTemplateColumns="repeat("+(pairs===6?3:4)+",1fr)";
    deck.forEach(function(n,i){
      var b=document.createElement("button");b.type="button";b.className="card";b.dataset.sym=n;
      b.setAttribute("aria-label","Карточка "+(i+1));
      b.innerHTML='<div class="in"><div class="b"></div><div class="f"><svg viewBox="0 0 64 64" aria-hidden="true">'+ICONS[n]+'</svg></div></div>';
      b.addEventListener("click",function(){flip(b)});
      board.insertBefore(b,win);
    });
    first=null;lock=false;moves=0;found=0;mv.textContent="0";win.classList.remove("on");
  }
  function flip(c){
    if(lock||c.classList.contains("open")||c.classList.contains("done"))return;
    c.classList.add("open");
    if(!first){first=c;return}
    moves++;mv.textContent=moves;
    if(first.dataset.sym===c.dataset.sym){
      first.classList.replace("open","done");c.classList.replace("open","done");
      first.disabled=c.disabled=true;first=null;found++;
      if(found===pairs){document.getElementById("wt").textContent="Все пары найдены за "+moves+" ходов";setTimeout(function(){win.classList.add("on")},500)}
    }else{
      lock=true;first=null;
      setTimeout(function(){board.querySelectorAll(".card.open").forEach(function(x){x.classList.remove("open")});lock=false},700);
    }
  }
  function level(n){pairs=n;document.getElementById("easy").setAttribute("aria-pressed",n===6);document.getElementById("hard").setAttribute("aria-pressed",n===8);start()}
  document.getElementById("easy").addEventListener("click",function(){level(6)});
  document.getElementById("hard").addEventListener("click",function(){level(8)});
  document.getElementById("again").addEventListener("click",start);
  start();
})();
</script>
</body>
</html>
